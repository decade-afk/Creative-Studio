<!--
  Creative Studio Logo - 主题自适应版本

  用途：软件左上角标志，根据主题色动态变化

  使用方法：
  通过 CSS 变量动态控制颜色

  示例：
  <style>
    .logo-theme {
      --logo-bg-start: #f5f3f0;
      --logo-bg-end: #e8e3dc;
      --logo-primary-start: #a07d5e;
      --logo-primary-end: #8b6342;
      --logo-accent-start: #c38859;
      --logo-accent-end: #a96f3d;
      --logo-ink-start: #6f4d34;
      --logo-ink-end: #5a3d2a;
    }
  </style>
-->
<svg
  width="48"
  height="48"
  viewBox="0 0 48 48"
  fill="none"
  role="img"
  aria-label="Creative Studio"
  xmlns="http://www.w3.org/2000/svg"
  class="logo-theme"
  style="cursor:pointer; display:block;">

  <style>
    /* 默认配色（中性浅色） */
    .logo-theme {
      --logo-bg-start: #f8f9fa;
      --logo-bg-end: #e9ecef;
      --logo-primary-start: #6c757d;
      --logo-primary-end: #495057;
      --logo-accent-start: #7c8db5;
      --logo-accent-end: #5b6d94;
      --logo-ink-start: #495057;
      --logo-ink-end: #343a40;
    }
  </style>

  <defs>
    <!-- 背景渐变 - 使用 CSS 变量 -->
    <linearGradient id="themeBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--logo-bg-start)"/>
      <stop offset="100%" style="stop-color:var(--logo-bg-end)"/>
    </linearGradient>

    <!-- 钢笔主体 - 使用 CSS 变量 -->
    <linearGradient id="themeMainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--logo-primary-start)"/>
      <stop offset="100%" style="stop-color:var(--logo-primary-end)"/>
    </linearGradient>

    <!-- C字母 - 使用 CSS 变量 -->
    <linearGradient id="themeAccentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--logo-accent-start)"/>
      <stop offset="100%" style="stop-color:var(--logo-accent-end)"/>
    </linearGradient>

    <!-- 墨滴 - 使用 CSS 变量 -->
    <linearGradient id="themeInkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:var(--logo-ink-start)"/>
      <stop offset="100%" style="stop-color:var(--logo-ink-end)"/>
    </linearGradient>
  </defs>

  <!-- 透明悬停区域 -->
  <rect width="48" height="48" fill="transparent" id="hoverTarget"/>

  <!-- 背景 -->
  <rect width="48" height="48" rx="12" fill="url(#themeBgGradient)"/>

  <!-- 内容组 -->
  <g id="iconRoot">
    <!-- 反转 C（开口向右） -->
    <g transform="translate(16,24)">
      <path
        d="M 0 -7 Q -4 0 0 7"
        stroke="url(#themeAccentGradient)"
        stroke-width="4"
        stroke-linecap="round"
        fill="none">
        <!-- C 缩放动效 -->
        <animateTransform
          attributeName="transform"
          type="scale"
          from="1" to="1.05"
          dur="0.4s" fill="freeze"
          begin="hoverTarget.mouseover"
          end="hoverTarget.mouseout"/>
      </path>
    </g>

    <!-- 钢笔 -->
    <path d="M 28 11 L 34 23 L 28 27 L 22 23 Z" fill="url(#themeMainGradient)"/>
    <rect x="26" y="19" width="4" height="8" fill="url(#themeMainGradient)" rx="1"/>

    <!-- 墨滴 -->
    <circle cx="28" cy="31" r="2.5" fill="url(#themeInkGradient)" opacity="0.9">
      <!-- 下落动画 -->
      <animate
        attributeName="cy"
        from="31" to="33"
        dur="0.4s" fill="freeze"
        begin="hoverTarget.mouseover"
        end="hoverTarget.mouseout"/>
      <animate
        attributeName="opacity"
        from="0.9" to="0.7"
        dur="0.4s" fill="freeze"
        begin="hoverTarget.mouseover"
        end="hoverTarget.mouseout"/>
    </circle>
  </g>
</svg>
