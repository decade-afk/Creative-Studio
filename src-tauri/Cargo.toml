[package]
name = "creative-studio-desktop"
version = "0.3.3"
description = "Creative Studio Desktop Application"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"

# Library configuration for Tauri
[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "creative_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 暂时禁用 - 仅在使用 LanceDB 时需要
# protobuf-src = "2.1"
# prost-build = "0.12"

[dependencies]
# Tauri framework and plugins
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# AI 服务调用（OpenAI 兼容 API，流式响应）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# 文档导出（DOCX 手工打包、EPUB 电子书）
zip = { version = "0.6", default-features = false, features = ["deflate"] }
epub-builder = "0.5"

# HTML 文本处理
html-escape = "0.2"

# 打印预览临时文件
tempfile = "3"

# 错误处理
anyhow = "1.0"          # 简化错误处理
thiserror = "1.0"       # 错误类型派生宏

# 日志系统
tracing = "0.1"         # 结构化日志
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-clipboard-manager = "2.4.1"
axum = "0.8.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1.53.2", features = ["net", "rt"] }
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
