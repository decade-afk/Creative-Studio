name: Build Creative Studio (Multi-platform)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  LOCI_VERSION: v0.1.0  # 指定 Loci 版本

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust (GNU toolchain)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm install

      - name: Build application (使用 Loci Git 依赖)
        run: npm run tauri build
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          dir src-tauri\target\x86_64-pc-windows-gnu\release\*.exe
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-studio-windows
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/*.exe
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run tauri build

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          ls -lh src-tauri/target/release/creative-studio-desktop || true
          ls -lh src-tauri/target/release/bundle/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-studio-linux
          path: |
            src-tauri/target/release/creative-studio-desktop
            src-tauri/target/release/bundle/

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run tauri build

      - name: List artifacts
        run: |
          echo "=== Build Artifacts ==="
          ls -lh src-tauri/target/release/creative-studio-desktop || true
          ls -lh src-tauri/target/release/bundle/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: creative-studio-macos
          path: |
            src-tauri/target/release/creative-studio-desktop
            src-tauri/target/release/bundle/
